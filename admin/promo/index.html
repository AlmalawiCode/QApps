<!DOCTYPE html>
<!--
  admin/promo/index.html — the owner's «free codes & downloads» dashboard
  (proposal proposals/qapps_free_codes_proposal_ar.html, decision و).
  Hand-written, not generated by tools/build.py. Holds no data itself: it
  reads /api/admin/promo, which answers only behind Cloudflare Access
  (the same Access application covers /admin and /api/admin).
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الأكواد والتحميل — كيو آبز</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F5F7;--surface:#fff;--soft:#E9EDF2;--ink:#0F1B2D;--muted:#556173;--line:#DCE1E8;--accent:#FF5B2E;--accent-soft:#FFE7DE;--mint:#0E9F73;--mint-soft:#D9F4EA;--bad:#B3261E;--bad-soft:#FDECEA;--ios:#0F1B2D;--and:#0E9F73}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.7}
h1,h2,h3{font-family:"Alexandria","IBM Plex Sans Arabic",sans-serif;margin:0}
header{background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:20px}
header h1 b{color:var(--accent)}
nav a{color:#C9D2DE;text-decoration:none;margin-inline-start:14px;font-weight:600}
nav a.on{color:#fff;border-bottom:2px solid var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:19px;margin:28px 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{font-style:normal;opacity:.7;margin-right:4px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:"Alexandria",sans-serif;font-size:26px;color:var(--accent);line-height:1.2}
.stat.ok b{color:var(--mint)}
.stat span{color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.warn{background:var(--bad-soft);border:1px solid #F3C6C1;color:var(--bad);border-radius:12px;padding:8px 12px;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
label{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:8px}
input[type=text],input[type=url],input[type=number],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;background:var(--surface)}
textarea{min-height:110px;font-family:monospace;direction:ltr}
.tog{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600}
.tog input{width:18px;height:18px;accent-color:var(--mint)}
button.save{border:0;border-radius:10px;padding:8px 16px;background:var(--ink);color:#fff;font:inherit;cursor:pointer;margin-top:10px}
button.save:disabled{opacity:.5}
.done{color:var(--mint);font-size:14px;margin-inline-start:8px}
table{border-collapse:collapse;width:100%;background:var(--surface);font-size:14px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600}
td.code{font-family:monospace;direction:ltr;text-align:left}
.st-issued{color:var(--accent);font-weight:700}
.st-available{color:var(--mint)}
.st-void{color:var(--muted);text-decoration:line-through}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
a.btnl,button.lnk{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none}
.more{display:block;margin:12px auto 0}
.note{font-size:13.5px;color:var(--muted)}
.err{text-align:center;color:var(--bad);padding:30px 10px;background:var(--bad-soft);border:1px dashed #F3C6C1;border-radius:16px}
</style>
</head>
<body>
<header>
  <div><h1><b>كيو</b> آبز · الأكواد والتحميل</h1></div>
  <nav><a href="/admin/">الرسائل</a><a href="/admin/promo/" class="on">الأكواد والتحميل</a></nav>
</header>
<div class="wrap" id="root">
  <div class="bar" id="apps"></div>
  <div id="main"></div>
</div>
<script>
(function () {
  "use strict";
  var DEV = {iphone: "آيفون", ipad: "آيباد", samsung: "سامسونج", android: "أندرويد", android_tablet: "تابلت أندرويد", mac: "ماك", windows: "ويندوز", linux: "لينكس", other: "أخرى"};
  var BR = {safari: "Safari", chrome: "Chrome", samsung: "Samsung Internet", firefox: "Firefox", edge: "Edge", opera: "Opera", instagram: "داخل إنستغرام", snapchat: "داخل سناب", tiktok: "داخل تيك توك", facebook: "داخل فيسبوك", x: "داخل X", whatsapp: "داخل واتساب", other: "أخرى"};
  var KIND = {download: "تحميل", youtube: "▶️ YouTube", redeem: "تفعيل العرض", code: "كود أُعطي", copy: "نسخ الكود", visit: "زيارة صفحة الحملة"};
  var ST = {issued: "أُعطيت ✗", available: "متاحة", void: "ملغاة"};
  var s = {app: "vault", days: 30, codeStatus: "issued", offset: 0, rows: [], sum: null};
  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
  function when(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    return d.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", {day: "numeric", month: "short"}) + " · " +
      d.toLocaleTimeString("ar-SA-u-nu-latn", {hour: "2-digit", minute: "2-digit"});
  }
  function src(v) { return !v || v === "direct" ? "مباشر" : v; }
  function api(path, body) {
    var opt = body ? {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)} : {cache: "no-store"};
    opt.credentials = "same-origin";
    return fetch(path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { d._code = r.status; return d; });
    });
  }
  function fail(d) {
    var t = d._code === 401 ? "غير مسموح. افتح الصفحة بعد تسجيل الدخول عبر Cloudflare Access." :
      d._code === 503 ? "النظام غير مُعدّ: قاعدة البيانات غير مربوطة بالموقع." : "تعذّر التحميل.";
    $("main").innerHTML = '<div class="err">' + esc(t) + "</div>";
  }

  function loadSummary() {
    api("/api/admin/promo?view=summary&days=" + s.days).then(function (d) {
      if (!d.ok) return fail(d);
      s.sum = d;
      render();
      loadCodes(true);
    }).catch(function () { fail({}); });
  }

  function appRow() { return (s.sum.apps || []).filter(function (a) { return a.slug === s.app; })[0]; }

  function render() {
    var d = s.sum, a = appRow();
    $("apps").innerHTML = d.apps.map(function (x) {
      return '<button class="chip' + (x.slug === s.app ? " on" : "") + '" data-app="' + esc(x.slug) + '">' + esc(x.name_ar || x.slug) + (x.offer_active ? " · 🎁" : "") + "</button>";
    }).join("");
    if (!a) return;
    var c = {available: 0, issued: 0, void: 0};
    d.codes.forEach(function (r) { if (r.app_id === a.id && r.platform === "android") c[r.status] = r.n; });
    var rec = (d.recent || []).filter(function (r) { return r.app_id === a.id; })[0] || {};
    var tot = function (platform, kind, key) {
      return (d.clicks.totals || []).filter(function (r) { return r.app_id === a.id && (!platform || r.platform === platform) && r.kind === kind; })
        .reduce(function (n, r) { return n + (r[key] || 0); }, 0);
    };
    var total = c.available + c.issued;
    var appleRedeem = tot("ios", "redeem", "all_time");
    var html = "";

    // The daily statistic the owner asked for (2026-11-06/07): one row per
    // Saudi date and app — App Store taps, Google Play taps, YouTube taps,
    // offer activations and codes given — never a counter without its date.
    var WD = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
    var dayLabel = function (day) { return WD[new Date(day + "T12:00:00+03:00").getDay()] + " " + day; };
    var COLS = ["ios", "android", "youtube", "redeem", "code"];
    var cell = function (r) { return r.kind === "download" ? (r.platform === "ios" ? "ios" : "android") : r.kind; };
    var blank = function () { return {ios: 0, android: 0, youtube: 0, redeem: 0, code: 0}; };
    var daily = {}, sum = blank();
    (d.clicks.byDay || []).forEach(function (r) {
      var c = cell(r);
      if (sum[c] === undefined) return;
      var k = r.day + "|" + r.app_id;
      var x = daily[k] || (daily[k] = {day: r.day, app_id: r.app_id, n: blank()});
      x.n[c] += r.n; sum[c] += r.n;
    });
    var dk = Object.keys(daily).sort(function (p, q) { return daily[q].day.localeCompare(daily[p].day) || daily[p].app_id - daily[q].app_id; });
    var appName = function (id) { var x = d.apps.filter(function (a) { return a.id === id; })[0]; return x ? (x.name_ar || x.slug) : id; };
    var cells = function (n) { return COLS.map(function (c) { return "<td>" + (n[c] || "·") + "</td>"; }).join(""); };
    html += '<h2>الإحصائية اليومية — كل التطبيقات</h2><div class="bar" id="days">' + [7, 30, 90, 365].map(function (n) {
      return '<button class="chip' + (s.days === n ? " on" : "") + '" data-days="' + n + '">آخر ' + n + " يومًا</button>";
    }).join("") + "</div>";
    html += '<p class="note">لكل يوم (بتوقيت السعودية) ولكل تطبيق: نقرات زر App Store، زر Google Play، زر YouTube، «فعّل العرض»، والأكواد التي أُعطيت. نقرة من موقعنا، لا تثبيت فعلي.</p>';
    html += '<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>التطبيق</th><th>🍎 App Store</th><th>🤖 Google Play</th><th>▶️ YouTube</th><th>تفعيل العرض</th><th>أكواد</th></tr></thead><tbody>' +
      (dk.length ? dk.map(function (k) { var x = daily[k]; return "<tr><td>" + dayLabel(x.day) + "</td><td>" + esc(appName(x.app_id)) + "</td>" + cells(x.n) + "</tr>"; }).join("") +
                   '<tr><th>المجموع (آخر ' + s.days + ' يومًا)</th><th></th>' + COLS.map(function (c) { return "<th>" + sum[c] + "</th>"; }).join("") + "</tr>"
                 : '<tr><td colspan="7">لا نقرات في هذه الفترة.</td></tr>') + "</tbody></table></div>";

    html += '<h2>العرض المجاني</h2><div class="stats">' +
      '<div class="stat"><b>' + total + '</b><span>أكواد أندرويد</span></div>' +
      '<div class="stat"><b>' + c.issued + '</b><span>أُعطيت ✗ (اليوم ' + (rec.d1 || 0) + ' · الأسبوع ' + (rec.d7 || 0) + ')</span></div>' +
      '<div class="stat ok"><b>' + c.available + '</b><span>باقية</span></div>' +
      '<div class="stat"><b>' + appleRedeem + (a.apple_offer_limit ? " / " + a.apple_offer_limit : "") + '</b><span>ضغطات «فعّل» في أبل (العدد الحقيقي في App Store Connect)</span></div>' +
      "</div>";
    if (a.offer_active && total && c.available < 50) html += '<div class="warn">بقي أقل من 50 كودًا لأندرويد. أضف أكوادًا من Play Console أو أوقف العرض.</div>';

    html += '<div class="grid2" style="margin-top:12px"><div class="card"><h3 style="font-size:16px">الإعدادات</h3>' +
      '<label class="tog"><input type="checkbox" id="o-active"' + (a.offer_active ? " checked" : "") + '> العرض يعمل (يظهر في صفحة التطبيق)</label>' +
      '<label class="tog"><input type="checkbox" id="o-apple"' + (a.apple_offer_on ? " checked" : "") + '> بطاقة أبل «فعّل العرض» ظاهرة</label>' +
      '<label>رابط عرض App Store</label><input type="url" id="o-url" dir="ltr" value="' + esc(a.apple_offer_url || "") + '">' +
      '<label>حدّ عرض أبل (للعرض في اللوحة فقط)</label><input type="number" id="o-limit" min="1" value="' + esc(a.apple_offer_limit || "") + '">' +
      '<label>ينتهي العرض في (اتركه فارغًا: بلا تاريخ)</label><input type="date" id="o-end" value="' + esc((a.offer_ends_at || "").slice(0, 10)) + '">' +
      '<button class="save" id="o-save">حفظ</button><span class="done" id="o-done" hidden>✓ حُفظ</span></div>' +
      '<div class="card"><h3 style="font-size:16px">أضف أكواد Google Play</h3>' +
      '<p class="note">الصق الأكواد كما نزّلتها من Play Console (سطر لكل كود، أو CSV). المكرر يُتجاهل.</p>' +
      '<textarea id="add-codes" placeholder="ABCD1234…"></textarea>' +
      '<button class="save" id="add-go">أضف</button><span class="done" id="add-done" hidden></span>' +
      '<p class="note" style="margin-top:10px"><a class="btnl" href="/api/admin/promo?view=csv&app=' + encodeURIComponent(a.slug) + '">⬇ تصدير كل الأكواد CSV</a></p></div></div>';

    html += '<h2>الأكواد</h2><div class="bar" id="code-st">' + Object.keys(ST).map(function (k) {
      return '<button class="chip' + (s.codeStatus === k ? " on" : "") + '" data-cst="' + k + '">' + ST[k] + "<i>" + (c[k] || 0) + "</i></button>";
    }).join("") + '</div><div class="tbl-wrap"><table><thead><tr><th>الكود</th><th>الحالة</th><th>متى</th><th>الجهاز</th><th>المتصفح</th><th>المصدر</th><th>الصفحة</th><th></th></tr></thead><tbody id="codes"></tbody></table></div>' +
      '<button class="lnk more" id="more" hidden>المزيد</button>';

    // downloads
    html += '<h2>مجاميع ' + esc(a.name_ar || a.slug) + '</h2>';
    html += '<p class="note">مجاميع سريعة فقط؛ التفصيل بالتاريخ في الجدولين أعلاه وأدناه. التثبيت الحقيقي في Play Console وApp Store Connect.</p>';
    var rows = [["ios", "download"], ["android", "download"], [null, "youtube"], ["ios", "redeem"], ["android", "redeem"], ["android", "code"], ["android", "copy"], [null, "visit"]];
    html += '<div class="tbl-wrap"><table><thead><tr><th></th><th>آخر 24 ساعة</th><th>آخر 7 أيام</th><th>الكل</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var lbl = (r[0] === "ios" ? "🍎 App Store · " : r[0] === "android" ? "🤖 Google Play · " : "") + KIND[r[1]];
        return "<tr><td>" + lbl + "</td><td>" + tot(r[0], r[1], "d1") + "</td><td>" + tot(r[0], r[1], "d7") + "</td><td>" + tot(r[0], r[1], "all_time") + "</td></tr>";
      }).join("") + "</tbody></table></div>";

    // Details per day for the selected app: where the taps came from, on
    // which devices and from which pages — every row carries its date.
    var det = {};
    var add = function (list, field, fmt) {
      list.forEach(function (r) {
        if (r.app_id !== a.id || r.kind === "visit") return;
        var x = det[r.day] || (det[r.day] = {source: {}, device: {}, page: {}});
        var k = fmt(r[field] || "—");
        x[field][k] = (x[field][k] || 0) + r.n;
      });
    };
    add(d.clicks.bySource || [], "source", src);
    add(d.clicks.byDevice || [], "device", function (k) { return DEV[k] || k; });
    add(d.clicks.byPage || [], "page", function (k) { return k; });
    var lst = function (m) {
      return Object.keys(m).sort(function (p, q) { return m[q] - m[p]; }).map(function (k) { return esc(k) + " <b>" + m[k] + "</b>"; }).join(" · ") || "—";
    };
    var dks = Object.keys(det).sort().reverse();
    html += '<h2 style="font-size:16px">تفاصيل ' + esc(a.name_ar || a.slug) + ' بالأيام</h2>';
    html += '<p class="note">لكل يوم: نقرات التطبيق (App Store + Google Play)، وYouTube، ومن أين جاء الزائر وبأي جهاز ومن أي صفحة. الأرقام في الخلايا الثلاث الأخيرة تشمل كل النقرات (تحميل، تفعيل، أكواد، YouTube).</p>';
    html += dks.length ? '<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>نقرات التطبيق</th><th>▶️ YouTube</th><th>المصدر</th><th>الجهاز</th><th>الصفحة</th></tr></thead><tbody>' +
      dks.map(function (day) {
        var n = (daily[day + "|" + a.id] || {n: blank()}).n, x = det[day];
        return "<tr><td>" + dayLabel(day) + "</td><td>" + (n.ios + n.android || "·") + "</td><td>" + (n.youtube || "·") + "</td><td>" + lst(x.source) + "</td><td>" + lst(x.device) + "</td><td>" + lst(x.page) + "</td></tr>";
      }).join("") + "</tbody></table></div>" : '<p class="note">لا نقرات في هذه الفترة.</p>';

    $("main").innerHTML = html;
  }

  function loadCodes(reset) {
    var a = appRow();
    if (!a) return;
    if (reset) { s.offset = 0; s.rows = []; }
    api("/api/admin/promo?view=codes&app=" + encodeURIComponent(a.slug) + "&status=" + s.codeStatus + "&offset=" + s.offset).then(function (d) {
      if (!d.ok) return;
      s.rows = s.rows.concat(d.codes || []);
      s.offset = s.rows.length;
      var body = $("codes");
      if (!body) return;
      body.innerHTML = s.rows.length ? s.rows.map(function (r) {
        var act = r.status === "available" ? '<button class="lnk" data-void="' + r.id + '">ألغِ</button>' :
          r.status === "void" && !r.issued_at ? '<button class="lnk" data-restore="' + r.id + '">أعِد</button>' :
          r.status === "issued" ? '<button class="lnk" data-release="' + r.id + '" title="لكود تجربة أو كود لم يُفعَّل في Google Play">↩ إرجاع</button>' : "";
        return '<tr><td class="code">' + esc(r.code) + '</td><td class="st-' + r.status + '">' + ST[r.status] + "</td><td>" + when(r.issued_at) +
          "</td><td>" + esc(DEV[r.device] || r.device || "") + "</td><td>" + esc(BR[r.browser] || r.browser || "") + "</td><td>" + esc(r.issued_at ? src(r.source) : "") +
          "</td><td>" + esc(r.page || "") + "</td><td>" + act + "</td></tr>";
      }).join("") : '<tr><td colspan="8" class="note">لا أكواد هنا.</td></tr>';
      $("more").hidden = s.rows.length >= d.total;
    });
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.app) { s.app = t.dataset.app; s.codeStatus = "issued"; render(); loadCodes(true); return; }
    if (t.dataset.cst) { s.codeStatus = t.dataset.cst; render(); loadCodes(true); return; }
    if (t.dataset.days) { s.days = Number(t.dataset.days); loadSummary(); return; }
    if (t.id === "more") { loadCodes(false); return; }
    if (t.dataset.release) {
      if (!confirm("إرجاع هذا الكود إلى المتاح؟\n\nفقط إذا لم يُفعَّل في Google Play (مثل كود تجربة). الكود المُفعَّل لا يعمل مرة أخرى، وسيصل لزائر آخر معطّلًا.")) return;
      api("/api/admin/promo", {action: "release", id: Number(t.dataset.release)}).then(loadSummary);
      return;
    }
    if (t.dataset.void || t.dataset.restore) {
      api("/api/admin/promo", {action: t.dataset.void ? "void" : "restore", id: Number(t.dataset.void || t.dataset.restore)}).then(loadSummary);
      return;
    }
    if (t.id === "o-save") {
      t.disabled = true;
      var end = $("o-end").value;
      api("/api/admin/promo", {
        action: "offer", app: s.app, offer_active: $("o-active").checked, apple_offer_on: $("o-apple").checked,
        apple_offer_url: $("o-url").value, apple_offer_limit: $("o-limit").value,
        // end of that day, Saudi time (UTC+3)
        offer_ends_at: end ? end + "T23:59:59+03:00" : "",
      }).then(function (d) {
        t.disabled = false;
        if (!d.ok) return alert("لم يُحفظ: " + (d.error || ""));
        loadSummary();
      });
      return;
    }
    if (t.id === "add-go") {
      var txt = $("add-codes").value;
      if (!txt.trim()) return;
      t.disabled = true;
      api("/api/admin/promo", {action: "add", app: s.app, codes: txt}).then(function (d) {
        t.disabled = false;
        if (!d.ok) return alert(d.error === "no_codes" ? "لم أجد أكوادًا في النص." : "لم تُضف.");
        alert("وُجد " + d.found + " كودًا: أُضيف " + d.added + "، ومكرر " + d.duplicates + ".");
        loadSummary();
      });
    }
  });
  loadSummary();
})();
</script>
</body>
</html>
