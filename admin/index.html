<!DOCTYPE html>
<!--
  admin/index.html — the owner's dashboard for «Contact & suggest» messages
  (approved proposal proposals/qapps_feedback_proposal_ar.html, decision و).
  Hand-written, not generated by tools/build.py. Holds no data itself: it
  reads /api/admin/messages, which answers only behind Cloudflare Access
  (see README → "Contact & suggest"). noindex and disallowed in robots.txt.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الرسائل — كيو آبز</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F5F7;--surface:#fff;--soft:#E9EDF2;--ink:#0F1B2D;--muted:#556173;--line:#DCE1E8;--accent:#FF5B2E;--accent-soft:#FFE7DE;--mint:#0E9F73;--mint-soft:#D9F4EA;--bad:#B3261E;--bad-soft:#FDECEA;--warn-soft:#FFF4DC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.7}
h1,h2,h3{font-family:"Alexandria","IBM Plex Sans Arabic",sans-serif;margin:0}
header{background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:20px}
header h1 b{color:var(--accent)}
header small{color:#C9D2DE}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:"Alexandria",sans-serif;font-size:26px;color:var(--accent);line-height:1.2}
.stat span{color:var(--muted);font-size:13.5px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.bar .lbl{color:var(--muted);font-size:13px;font-weight:600;margin-left:4px;min-width:56px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{font-style:normal;opacity:.7;margin-right:4px;font-size:12px}
input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;background:var(--surface)}
.list{display:grid;gap:12px;margin-top:14px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;border-right:5px solid var(--line)}
.msg.s-new{border-right-color:var(--accent)} .msg.s-review{border-right-color:#E8A500} .msg.s-done{border-right-color:var(--mint)} .msg.s-archived{opacity:.7}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.tag{background:var(--soft);color:var(--ink);border-radius:8px;padding:1px 9px;font-weight:600}
.tag.app{background:var(--accent-soft)}
.tag.flag{background:var(--bad-soft);color:var(--bad)}
.body{white-space:pre-wrap;margin:8px 0;font-size:16px}
.who{font-size:14px;color:var(--muted)}
.who b{color:var(--ink)}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-top:10px}
select{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;background:var(--surface)}
textarea{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;min-height:38px;resize:vertical}
button.save{border:0;border-radius:10px;padding:7px 14px;background:var(--ink);color:#fff;font:inherit;cursor:pointer}
button.save:disabled{opacity:.5}
.saved{color:var(--mint);font-size:13px;align-self:center}
.empty,.err{text-align:center;color:var(--muted);padding:40px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.err{color:var(--bad);border-color:#F3C6C1;background:var(--bad-soft)}
.more{display:block;margin:16px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 18px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<header>
  <div><h1><b>كيو</b> آبز · الرسائل</h1><small>تواصل واقترح — لك وحدك</small></div>
  <small id="who"></small>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="bar" id="f-status"><span class="lbl">الحالة</span></div>
  <div class="bar" id="f-app"><span class="lbl">التطبيق</span></div>
  <div class="bar" id="f-type"><span class="lbl">النوع</span></div>
  <div class="bar"><input type="search" id="q" placeholder="ابحث في النص أو الاسم أو الملاحظة…"></div>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>المزيد</button>
</div>
<script>
(function () {
  "use strict";
  var APP = {docmatic: "DocMatic", vault: "خزنة الضمانات", "countdown-keeper": "كم مضى وكم بقي", "new-app": "فكرة تطبيق جديد", general: "الموقع / عام"};
  var TYPE = {message: "💬 رسالة", improve: "💡 تحسين", feature: "🚀 فكرة ميزة", problem: "🐞 مشكلة"};
  var STATUS = {new: "جديدة", review: "قيد الدراسة", done: "نُفّذت", archived: "مؤرشفة"};
  var state = {status: "", app: "", type: "", q: "", offset: 0, rows: []};
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
  function when(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", {day: "numeric", month: "short"}) + " · " +
      d.toLocaleTimeString("ar-SA-u-nu-latn", {hour: "2-digit", minute: "2-digit"});
  }

  function chips(box, key, map, counts) {
    var el = $(box);
    el.querySelectorAll(".chip").forEach(function (c) { c.remove(); });
    var all = [["", key === "status" ? "الكل (بلا المؤرشفة)" : "الكل"]].concat(Object.keys(map).map(function (k) { return [k, map[k]]; }));
    all.forEach(function (p) {
      var b = document.createElement("button");
      b.className = "chip" + (state[key] === p[0] ? " on" : "");
      b.innerHTML = esc(p[1]) + (counts && counts[p[0]] ? "<i>" + counts[p[0]] + "</i>" : "");
      b.onclick = function () { state[key] = p[0]; load(true); };
      el.appendChild(b);
    });
  }

  function render(d) {
    var c = d.counts || {status: {}, app: {}, week: {}};
    var w = c.week || {};
    $("stats").innerHTML =
      '<div class="stat"><b>' + (c.status.new || 0) + '</b><span>رسائل جديدة</span></div>' +
      '<div class="stat"><b>' + (w.feature || 0) + '</b><span>أفكار ميزات هذا الأسبوع</span></div>' +
      '<div class="stat"><b>' + (w.problem || 0) + '</b><span>مشكلات هذا الأسبوع</span></div>' +
      '<div class="stat"><b>' + (c.status.done || 0) + '</b><span>نُفّذت</span></div>';
    chips("f-status", "status", STATUS, c.status);
    chips("f-app", "app", APP, c.app);
    chips("f-type", "type", TYPE, null);
    var list = $("list");
    if (!state.rows.length) { list.innerHTML = '<div class="empty">لا توجد رسائل هنا.</div>'; $("more").hidden = true; return; }
    list.innerHTML = state.rows.map(function (m) {
      var opts = Object.keys(STATUS).map(function (k) { return '<option value="' + k + '"' + (m.status === k ? " selected" : "") + ">" + STATUS[k] + "</option>"; }).join("");
      return '<article class="msg s-' + esc(m.status) + '" data-id="' + m.id + '">' +
        '<div class="top"><span class="tag app">' + esc(APP[m.app] || m.app) + '</span><span class="tag">' + esc(TYPE[m.type] || m.type) + '</span>' +
        (m.flagged ? '<span class="tag flag">مشبوهة (روابط كثيرة)</span>' : "") +
        '<span>#' + m.id + ' · ' + when(m.created_at) + (m.lang ? " · " + (m.lang === "ar" ? "عربي" : "English") : "") + '</span></div>' +
        '<div class="body">' + esc(m.body) + '</div>' +
        ((m.name || m.contact) ? '<div class="who">' + (m.name ? "الاسم: <b>" + esc(m.name) + "</b>" : "") + (m.name && m.contact ? " · " : "") + (m.contact ? "للرد: <b>" + esc(m.contact) + "</b>" : "") + '</div>' : "") +
        '<div class="act"><select data-status>' + opts + '</select>' +
        '<textarea data-note placeholder="ملاحظتك الخاصة…">' + esc(m.note || "") + '</textarea>' +
        '<button class="save" data-save>حفظ</button><span class="saved" data-saved hidden>✓ حُفظ</span></div></article>';
    }).join("");
    $("more").hidden = state.rows.length >= d.total;
  }

  function load(reset) {
    if (reset) { state.offset = 0; state.rows = []; }
    var u = new URLSearchParams({status: state.status, app: state.app, type: state.type, q: state.q, offset: state.offset});
    fetch("/api/admin/messages?" + u, {credentials: "same-origin", cache: "no-store"})
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return {code: r.status, d: d}; }); })
      .then(function (res) {
        if (res.code === 401) return fail("غير مسموح. افتح هذه الصفحة بعد تسجيل الدخول عبر Cloudflare Access (رمز يصل إلى بريدك).");
        if (res.code === 503) return fail("النظام غير مُعدّ بعد: قاعدة البيانات غير مربوطة بالموقع (انظر README).");
        if (!res.d.ok) return fail("تعذّر تحميل الرسائل.");
        state.rows = state.rows.concat(res.d.messages || []);
        state.offset = state.rows.length;
        render(res.d);
      })
      .catch(function () { fail("لا اتصال بالموقع."); });
  }
  function fail(t) { $("list").innerHTML = '<div class="err">' + esc(t) + "</div>"; $("more").hidden = true; }

  $("list").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-save]");
    if (!btn) return;
    var card = btn.closest(".msg");
    var body = {id: Number(card.getAttribute("data-id")), status: card.querySelector("[data-status]").value, note: card.querySelector("[data-note]").value};
    btn.disabled = true;
    fetch("/api/admin/messages", {method: "POST", headers: {"content-type": "application/json"}, credentials: "same-origin", body: JSON.stringify(body)})
      .then(function (r) { return r.json(); })
      .then(function (d) {
        btn.disabled = false;
        if (!d.ok) return alert("لم يُحفظ.");
        card.className = "msg s-" + body.status;
        var s = card.querySelector("[data-saved]"); s.hidden = false; setTimeout(function () { s.hidden = true; }, 1600);
        state.rows.forEach(function (m) { if (m.id === body.id) { m.status = body.status; m.note = body.note; } });
      })
      .catch(function () { btn.disabled = false; alert("لا اتصال."); });
  });
  var timer;
  $("q").addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(function () { state.q = $("q").value.trim(); load(true); }, 350); });
  $("more").addEventListener("click", function () { load(false); });
  load(true);
})();
</script>
</body>
</html>
